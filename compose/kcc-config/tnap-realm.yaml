    attributes:
      sdc_user:
        - "cs0008"
    realmRoles:
      - default-roles-tnap
      - portal_operator
    groups: []
  # The only user with mvp_operator, so it is the only one that sees the RAT treeview.
  # Keeping it off every other user is what lets the node-view suites keep passing:
  # treeview.component.html gates the two tree modes on an exclusive @if.
  - username: "mvp-operator"
    enabled: true
    emailVerified: false
    firstName: "FirstName4mvp-operator"
    lastName: "LastName4tnap4mvp-operator"
    email: "mvp-operator@example.xyz"
    credentials:
      - type: password
        secretData: "{\"value\":\"nD4K4x8HEgk6xlWIAgzZOE+EOjdbovJfEa7N3WXwIMCWCfdXpn7Riys7hZhI1NbKcc9QPI9j8LQB/JSuZVcXKA==\",\"salt\":\"T8X9A9tT2cyLvEjHFo+zuQ==\",\"additionalParameters\":{}}"
        credentialData: "{\"hashIterations\":27500,\"algorithm\":\"pbkdf2-sha256\"}"
    attributes:
      sdc_user:
        - "cs0008"
    realmRoles:
      - default-roles-tnap
      - portal_operator
      - mvp_operator
    groups: []
  - username: "service-account-portal-bff"
    emailVerified: false
    credentials: []
    realmRoles:
      - default-roles-tnap
    clientRoles:
      realm-management:
        - manage-realm
        - manage-users
    groups: []
clients:
  - clientId: portal-app
    redirectUris:
      - http://localhost:4200/*
    attributes:
      "post.logout.redirect.uris": "http://localhost:4200/*"
    webOrigins:
      - "*"
    publicClient: "true"
    frontchannelLogout: "false"
    protocolMappers:
      - name: "User-Roles"
        protocol: openid-connect
        protocolMapper: "oidc-usermodel-realm-role-mapper"
        config:
          userinfo.token.claim: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "roles"
          multivalued: "true"
      - name: "SDC-User"
        protocol: openid-connect
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          userinfo.token.claim: "true"
          user.attribute: "sdc_user"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "sdc_user"
          jsonType.label: "String"
  - clientId: portal-bff
    secret: 5933482a-9f4c-44e0-9814-dca17e0a9137
    standardFlowEnabled: "false"
    directAccessGrantsEnabled: "false"
    serviceAccountsEnabled: "true"
    attributes:
      frontchannel.logout.session.required: "false"
    protocolMappers:
      - name: "Client IP Address"
        protocol: openid-connect
        protocolMapper: "oidc-usersessionmodel-note-mapper"
        config:
          user.session.note: "clientAddress"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "clientAddress"
          jsonType.label: "String"
      - name: "Client Host"
        protocol: openid-connect
        protocolMapper: "oidc-usersessionmodel-note-mapper"
        config:
          user.session.note: "clientHost"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "clientHost"
          jsonType.label: "String"
      - name: "Client ID"
        protocol: openid-connect
        protocolMapper: "oidc-usersessionmodel-note-mapper"
        config:
          user.session.note: "client_id"
          id.token.claim: "true"
          access.token.claim: "true"
          claim.name: "client_id"
          jsonType.label: "String"
    authorizationServicesEnabled: 'true'
    authorizationSettings:
      allowRemoteResourceManagement: 'true'
      policyEnforcementMode: ENFORCING
      decisionStrategy: UNANIMOUS
      resources:
        - name: default_resource
