      - portal_designer
    groups: []
  - username: "tnap-operator"
    enabled: true
    emailVerified: false
    firstName: "FirstName4tnap-operator"
    lastName: "LastName4tnap-operator"
    email: "tnap-operator@example.xyz"
    credentials:
      - type: password
        secretData: "{\"value\":\"nD4K4x8HEgk6xlWIAgzZOE+EOjdbovJfEa7N3WXwIMCWCfdXpn7Riys7hZhI1NbKcc9QPI9j8LQB/JSuZVcXKA==\",\"salt\":\"T8X9A9tT2cyLvEjHFo+zuQ==\",\"additionalParameters\":{}}"
