    attributes:
      sdc_user:
        - "cs0008"
    realmRoles:
      - default-roles-tnap
      - portal_operator
    groups: []
  - username: "e2e-admin"
    enabled: true
    emailVerified: false
    firstName: "FirstName4e2e-admin"
    lastName: "LastName4tnap4e2e-admin"
    email: "e2e-admin@example.xyz"
    credentials:
      - type: password
        secretData: "{\"value\":\"nD4K4x8HEgk6xlWIAgzZOE+EOjdbovJfEa7N3WXwIMCWCfdXpn7Riys7hZhI1NbKcc9QPI9j8LQB/JSuZVcXKA==\",\"salt\":\"T8X9A9tT2cyLvEjHFo+zuQ==\",\"additionalParameters\":{}}"
        credentialData: "{\"hashIterations\":27500,\"algorithm\":\"pbkdf2-sha256\"}"
    attributes:
      sdc_user:
        - "cs0008"
    realmRoles:
      - default-roles-tnap
      - portal_operator
    groups: []
  - username: "e2e-designer"
    enabled: true
    emailVerified: false
    firstName: "FirstName4e2e-designer"
    lastName: "LastName4tnap4e2e-designer"
