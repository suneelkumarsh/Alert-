realm: tnap
enabled: true
displayName: "Telekom TNAP Portal"
# Keycloak's 5-minute default access-token lifespan is shorter than a full parallel suite
# run (~11 min), and the `setup` project mints ONE token that every spec then replays. A
# spec starting after minute 5 would present an expired token, which is worse than none:
# the app fetches permissions with it, gets 401, and every permission guard fails closed
# to /statusPage — so the whole tail of the suite fails on "element(s) not found" rather
# than on anything it was testing. Sized well past the suite runtime; this realm is local
# test-only infrastructure and is never deployed.
accessTokenLifespan: 3600
ssoSessionIdleTimeout: 7200
ssoSessionMaxLifespan: 7200
attributes:
  # configures the hostname that is used in the
  # /realms/tnap/.well-known/openid-configuration
  # endpoint
  frontendUrl: "http://localhost:4200"
# in app-config, the key is called 'initialUsers'
# instead of 'users'
users:
  - username: test-admin
    enabled: true
    email: test-admin@tnap.com
    firstName: test
    lastName: admin
    emailVerified: true
    credentials:
      - type: password
        secretData: "{\"value\":\"nD4K4x8HEgk6xlWIAgzZOE+EOjdbovJfEa7N3WXwIMCWCfdXpn7Riys7hZhI1NbKcc9QPI9j8LQB/JSuZVcXKA==\",\"salt\":\"T8X9A9tT2cyLvEjHFo+zuQ==\",\"additionalParameters\":{}}"
        credentialData: "{\"hashIterations\":27500,\"algorithm\":\"pbkdf2-sha256\"}"
    attributes:
      sdc_user:
        - "cs0008"
    realmRoles:
      - default-roles-tnap
      - portal_admin
      - portal_designer
      - portal_operator
  - username: "tnap-designer"
    enabled: true
    emailVerified: false
    firstName: "FirstName4tnap-designer"
    lastName: "LastName4tnap-designer"
    email: "tnap-designer@example.xyz"
    credentials:
      - type: password
        secretData: "{\"value\":\"nD4K4x8HEgk6xlWIAgzZOE+EOjdbovJfEa7N3WXwIMCWCfdXpn7Riys7hZhI1NbKcc9QPI9j8LQB/JSuZVcXKA==\",\"salt\":\"T8X9A9tT2cyLvEjHFo+zuQ==\",\"additionalParameters\":{}}"
        credentialData: "{\"hashIterations\":27500,\"algorithm\":\"pbkdf2-sha256\"}"
    attributes:
      sdc_user:
        - "cs0008"
    realmRoles:
