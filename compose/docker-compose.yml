services:
  keycloak:
    container_name: keycloak
    image: artifactory.devops.telekom.de/hub.docker.com/keycloak/keycloak:25.0
    hostname: keycloak
    command:
      - 'start-dev'
      - '--http-port=9090'
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    environment:
      KC_HTTP_PORT: 9090
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    ports:
      - 9090:9090/tcp
    networks:
      keycloak:
        aliases:
          - keycloak.local
  keycloak-config-cli:
    image: artifactory.devops.telekom.de/hub.docker.com/adorsys/keycloak-config-cli:latest-25
    depends_on:
      - keycloak
    volumes:
      - ./kcc-config:/config
    environment:
      - KEYCLOAK_URL=http://keycloak:9090
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=password
    restart: on-failure:200
    networks:
      keycloak: {}
      keycloak-config-cli: {}
  wiremock:
    image: artifactory.devops.telekom.de/hub.docker.com/wiremock/wiremock:latest
    ports:
      - "8085:8080"
    volumes:
      - type: bind
        source: ../wiremock/mappings
        target: /home/wiremock/mappings
    command: ["--verbose"]

networks:
  keycloak: {}
  keycloak-config-cli: {}
